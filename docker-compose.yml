services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      PISTACHIO_ENV: local
      PISTACHIO_STORE_BACKEND: memory
      PISTACHIO_EXECUTION_BACKEND: docker
      PISTACHIO_AUTH_MODE: dev
      PISTACHIO_BATCH_IMAGE: pistachio-science:local
      PISTACHIO_ARTIFACT_ROOT: /app/.pistachio/artifacts
      PISTACHIO_DOCKER_ARTIFACT_ROOT: ${PWD}/.pistachio/artifacts
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.pistachio:/app/.pistachio
    read_only: true
    tmpfs:
      - /tmp

