services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      MICA_ENV: local
      MICA_STORE_BACKEND: memory
      MICA_EXECUTION_BACKEND: docker
      MICA_AUTH_MODE: dev
      MICA_BATCH_IMAGE: mica-science:local
      MICA_ARTIFACT_ROOT: /app/.mica/artifacts
      MICA_DOCKER_ARTIFACT_ROOT: ${PWD}/.mica/artifacts
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.mica:/app/.mica
    read_only: true
    tmpfs:
      - /tmp

