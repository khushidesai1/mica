# Reference delta for the EXISTING Slack app. Keep its current request URL and
# unrelated settings; do not import as a new app. Reinstall only for scope changes.
display_information:
  name: Pistachio
features:
  bot_user:
    display_name: Pistachio
    always_online: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - im:history
      - files:read
      - files:write
      - reactions:write
      - users:read
      - users:read.email
      # Membership allowlist and admin onboarding, including private channels:
      - channels:read
      - groups:read
      - app_mentions:read
      # Channel conversation follow-ups:
      - channels:history
      - groups:history
settings:
  socket_mode_enabled: false
  event_subscriptions:
    # Preserve the current /integrations/slack/events request_url in app settings.
    bot_events:
      - message.im
      # Required for channel onboarding:
      - app_mention
      # Channel conversation follow-ups:
      - message.channels
      - message.groups
