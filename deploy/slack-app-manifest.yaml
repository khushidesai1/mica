# Reference delta for the EXISTING Slack app. Keep its current request URL and
# unrelated settings; do not import as a new app. Reinstall only for scope changes.
display_information:
  name: Mica
features:
  # Treat this cutover as one-way. Validate on a separate app before updating the live app.
  agent_view:
    agent_description: >-
      Mica is your lab's analysis agent. Ask about project data, run analyses,
      make plots, and manage files. GPU runs and some file changes ask for your approval first.
    suggested_prompts:
      - title: What's in my project?
        message: What datasets are in this project?
      - title: Make a plot
        message: Plot my latest dataset colored by cell type
      - title: Project brief
        message: Show me this project's brief
  bot_user:
    display_name: Mica
    always_online: false
oauth_config:
  scopes:
    bot:
      - assistant:write
      - chat:write
      - im:history
      - files:read
      - files:write
      - reactions:write
      - users:read
      - users:read.email
      # Membership allowlist and admin onboarding, including private channels:
      - channels:read
      - groups:read
      - app_mentions:read
      # Channel conversation follow-ups:
      - channels:history
      - groups:history
settings:
  socket_mode_enabled: false
  interactivity:
    is_enabled: true
    # Set request_url to the existing Cloud Run URL + /integrations/slack/actions.
    # This reference delta does not change the live Slack app.
  event_subscriptions:
    # Preserve the current /integrations/slack/events request_url in app settings.
    bot_events:
      # Enable together with AGENT_SLACK_SESSIONS=true after the agent UI cutover checks.
      # - agent_session_stopped
      - message.im
      # Required for channel onboarding:
      - app_mention
      # Channel conversation follow-ups:
      - message.channels
      - message.groups
