steps:
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - PYTHON_IMAGE=${_PYTHON_IMAGE}
      - -f
      - docker/Dockerfile.api
      - -t
      - ${_API_IMAGE}
      - .
images:
  - ${_API_IMAGE}
timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _PYTHON_IMAGE: python:3.12.12-slim@sha256:f3fa41d74a768c2fce8016b98c191ae8c1bacd8f1152870a3f9f87d350920b7c
  _API_IMAGE: us-central1-docker.pkg.dev/example/mica-staging/api:bootstrap
