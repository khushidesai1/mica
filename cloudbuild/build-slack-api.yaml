steps:
  - id: build-slack-api
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - |
        [[ '${_API_BASE}' =~ @sha256:[a-f0-9]{64}$ ]]
        docker build --build-arg 'BASE_IMAGE=${_API_BASE}' --build-arg 'SOURCE_COMMIT=${_SOURCE_COMMIT}' -f docker/Dockerfile.slack-release -t '${_API_IMAGE}' .
  - id: verify-headless-api
    name: gcr.io/cloud-builders/docker
    args: [run, --rm, --network=none, -e, MICA_ARTIFACT_ROOT=/tmp/mica-smoke, -v, /workspace:/workspace:ro, --entrypoint, python, '${_API_IMAGE}', /workspace/scripts/check_headless_api.py]
  - id: verify-api-source-and-attachments
    name: gcr.io/cloud-builders/docker
    args: [run, --rm, --network=none, -v, /workspace:/workspace:ro, --entrypoint, python, '${_API_IMAGE}', /workspace/scripts/check_slack_release.py, api]
  - id: verify-atomx-api
    name: gcr.io/cloud-builders/docker
    args: [run, --rm, --network=none, -v, /workspace:/workspace:ro, --entrypoint, python, '${_API_IMAGE}', /workspace/scripts/check_atomx_release.py, api]
  - id: export-api-contract
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -ceu
      - docker run --rm --network=none -v /workspace:/workspace:ro --entrypoint python '${_API_IMAGE}' /workspace/scripts/check_worker_compatibility.py export - > /workspace/api-execution-contract.json
  - id: check-worker-contract
    name: gcr.io/cloud-builders/docker
    args: [run, --rm, --network=none, -v, /workspace:/workspace:ro, --entrypoint, python, '${_WORKER_IMAGE}', /workspace/scripts/check_worker_compatibility.py, check, /workspace/api-execution-contract.json]
images: ['${_API_IMAGE}']
options:
  logging: CLOUD_LOGGING_ONLY
timeout: 1800s
