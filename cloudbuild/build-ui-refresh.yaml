steps:
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args: [build, --build-arg, 'PYTHON_IMAGE=${_PYTHON_IMAGE}', -f, docker/Dockerfile.api, -t, '${_API_IMAGE}', .]
  - id: verify-packaged-ui
    name: gcr.io/cloud-builders/docker
    args:
      - run
      - --rm
      - ${_API_IMAGE}
      - python
      - -c
      - |
        from pathlib import Path
        import pistachio
        from pistachio.models import TaskRecord, ConversationMessage
        root = Path(pistachio.__file__).parent
        html = (root / 'api/templates/index.html').read_text()
        assert 'id="project-dialog"' in html
        assert 'renderConversation(task)' in html
        assert 'id="sidebar"' in html
        assert (root / 'api/static/pista_logo.svg').read_text().startswith('<svg')
        assert 'conversation' in TaskRecord.model_fields
        print('UI_AND_CONVERSATION_PACKAGE_VERIFIED')
images: ['${_API_IMAGE}']
timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
substitutions:
  _PYTHON_IMAGE: python:3.12.12-slim@sha256:f3fa41d74a768c2fce8016b98c191ae8c1bacd8f1152870a3f9f87d350920b7c
  _API_IMAGE: us-central1-docker.pkg.dev/azizilab-aml/pistachio-staging/api:ui-conversation-20260929
