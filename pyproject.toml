[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "mica-agent"
version = "0.1.0"
description = "Elastic, approval-gated bioinformatics agent system with project memory."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "cryptography==50.0.1",
  "dkimpy==1.1.8",
  "dnspython==2.8.0",
  "fastapi==0.141.1",
  "google-api-python-client==2.187.0",
  "google-auth==2.41.1",
  "google-cloud-batch==0.20.0",
  "google-cloud-firestore==2.21.0",
  "google-cloud-pubsub==2.31.1",
  "google-cloud-storage==3.4.0",
  "httpx==0.28.1",
  "h5py==3.16.0",
  "numpy==2.2.6",
  "openai==3.16.2",
  "openai-agents==0.22.3",
  "packaging==26.3",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.31",
  "PyYAML==6.0.3",
  "slack-bolt==1.27.0",
  "slack-sdk==3.39.0",
  "uvicorn[standard]==0.41.0",
]

[project.optional-dependencies]
slack = ["claude-agent-sdk==0.2.163", "anthropic==2.3.0", "aiohttp==3.14.3", "uv==0.9.6"]
analysis-test = ["anndata==0.12.2", "pandas==2.2.3", "pyarrow==25.0.1", "matplotlib==3.10.3", "pypdfium2==5.14.0", "shapely==2.1.1", "tifffile==2025.9.9", "zarr==3.1.3"]
transfer-test = ["paramiko==3.5.1"]
dev = [
  "google-auth-oauthlib==1.2.2",
  "jsonschema==4.26.0",
  "mypy==1.19.1",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.0.0",
  "ruff==0.15.4",
]

[project.scripts]
mica-analyze = "mica.agents.analysis.cli:run"
mica-api = "mica.api.app:run"
mica-worker = "mica.worker.main:run"
pistachio-analyze = "mica.agents.analysis.cli:run"
pistachio-api = "mica.api.app:run"
pistachio-worker = "mica.worker.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/mica", "src/pistachio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: paid Claude checks; require MICA_RUN_LIVE_TESTS=1 and ANTHROPIC_API_KEY"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests"]
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["google.*", "googleapiclient.*", "dkim.*", "h5py", "PIL.*", "pypdf", "defusedxml.*", "numpy", "anndata", "pyarrow.*"]
ignore_missing_imports = true
