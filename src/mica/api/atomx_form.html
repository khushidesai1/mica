<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mica · AtoMx connection</title>
<style nonce="NONCE">body{font:16px system-ui;background:#f6f6f2;color:#1e3029;max-width:480px;margin:8vh auto;padding:24px}main{background:white;border:1px solid #d7ded6;border-radius:16px;padding:28px}h1{font-size:24px}label,input,button{display:block;width:100%;box-sizing:border-box}label{margin:16px 0}input,button{padding:12px;border:1px solid #85998d;border-radius:8px;font:inherit}button{background:#234f3b;color:white;cursor:pointer;margin:12px 0}button.secondary{background:white;color:#234f3b}small{color:#53645a}#detail{white-space:pre-wrap;overflow-wrap:anywhere}[hidden]{display:none!important}</style>
<main><small>MICA / PRIVATE CONNECTION</small><h1>AtoMx</h1><p id="message">Open this private, single-use link to manage your connection or review a transfer. This link expires after 15 minutes.</p><button id="open">Open securely</button><div id="form" hidden><p id="account"></p><p id="detail"></p><form id="login"><label>Username<input id="username" autocomplete="username" maxlength="320" required></label><label>Password<input id="password" type="password" autocomplete="current-password" maxlength="4096" required></label><button type="submit">Save my connection</button></form><button id="forget" class="secondary" hidden>Forget my saved connection</button><button id="confirm" hidden>Confirm this transfer</button><button id="cancel" class="secondary" hidden>Cancel transfer</button></div></main>
<script nonce="NONCE">
let csrf='';const $=id=>document.getElementById(id);const message=t=>$('message').textContent=t;
async function call(path,body){const r=await fetch('/integrations/atomx/'+path,{method:body?'POST':'GET',credentials:'same-origin',headers:body?{'Content-Type':'application/json','X-CSRF-Token':csrf}:{},body:body?JSON.stringify(body):undefined,cache:'no-store'});const v=await r.json();if(!r.ok)throw Error(v.detail||'Please open a fresh private link from Mica.');return v;}
async function load(){const v=await call('session');csrf=v.csrf;$('open').hidden=true;$('form').hidden=false;$('account').textContent='For '+v.owner+' · '+v.host;$('detail').textContent=v.detail;$('login').hidden=v.purpose!=='connection';$('forget').hidden=v.purpose!=='connection'||!v.saved;$('confirm').hidden=v.purpose!=='approval';$('cancel').hidden=v.purpose!=='approval';message('This connection is private to your Mica account.');}
$('open').onclick=async()=>{try{if(location.hash){await call('exchange',{token:location.hash.slice(1)});history.replaceState(null,'',location.pathname);}await load();}catch(e){message(e.message);}};
async function act(action,extra={}){try{await call('action',{action,...extra});$('password').value='';$('form').hidden=true;message(action==='save'?'Connection saved, not yet tested. Your pending request will continue automatically.':action==='forget'?'Connection forgotten. New credential access is revoked. A running transfer may take a moment to stop.':action==='confirm'?'Transfer confirmed. Mica will report progress in your conversation.':'Transfer cancelled.');}catch(e){$('password').value='';message(e.message);}}
$('login').onsubmit=e=>{e.preventDefault();act('save',{username:$('username').value,password:$('password').value});};$('forget').onclick=()=>{if(confirm('Forget your saved AtoMx connection?'))act('forget');};$('confirm').onclick=()=>act('confirm');$('cancel').onclick=()=>act('cancel');
</script></html>
