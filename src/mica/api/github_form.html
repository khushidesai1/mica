<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mica · Connect GitHub</title>
<style nonce="NONCE">body{font:16px system-ui;color:#243532;background:#f7f9f6;margin:0;padding:10vh 24px}main{max-width:480px;margin:auto}h1{font-size:32px}button{padding:12px 20px;border:0;border-radius:8px;background:#204e42;color:white;font:inherit;cursor:pointer}p{line-height:1.6}small{letter-spacing:.1em}</style>
<main><small>MICA / PRIVATE CONNECTION</small><h1>Connect GitHub</h1><p id="message">Opening your private connection link…</p><button id="continue" hidden>Continue to GitHub</button></main>
<script nonce="NONCE">const msg=document.getElementById('message'),button=document.getElementById('continue');let csrf='';async function call(path,data){const r=await fetch('/integrations/github/'+path,{method:data?'POST':'GET',credentials:'same-origin',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},...(data?{body:JSON.stringify(data)}:{})});const v=await r.json();if(!r.ok)throw Error(v.detail||'Please request a fresh link from Mica.');return v;}async function open(){const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);if(token)await call('exchange',{token});const v=await call('session');csrf=v.csrf;msg.textContent='Connect GitHub to your Mica account '+v.owner+'. GitHub will let you choose the account to authorize. Only repositories available to both you and Mica can be used for PRs.';button.hidden=false;}button.onclick=async()=>{button.disabled=true;try{const v=await call('start',{});location.assign(v.url);}catch(e){msg.textContent=e.message;button.disabled=false;}};open().catch(e=>{msg.textContent=e.message;});</script></html>
