name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev,slack,analysis-test]'
      - run: ruff check src tests
      - run: mypy src/mica src/pistachio
      - run: pytest --cov=mica --cov-report=term-missing
      - run: python -m compileall -q src
